# Form Check — frontend + API (+ TTS) on one OCI VM
# Install: sudo cp deploy/nginx-formcheck.conf /etc/nginx/conf.d/formcheck.conf
#   then edit root path / server_name if needed, and: sudo nginx -t && sudo systemctl reload nginx
#
# Layout:
#   /           → static web UI
#   /health     → FastAPI coach API
#   /coach/*    → FastAPI
#   /sessions   → FastAPI
#   /docs,/openapi.json → FastAPI (optional)
#   /tts        → OpenAI TTS proxy (voice-feedback)

upstream formcheck_api {
    server 127.0.0.1:8000;
}

upstream formcheck_tts {
    server 127.0.0.1:3002;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # Change to your sslip.io or real domain
    server_name 207-211-163-177.sslip.io _;

    # --- Coach API (must be before the static "/" location) ---
    location = /health {
        proxy_pass http://formcheck_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /coach/ {
        proxy_pass http://formcheck_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /sessions {
        proxy_pass http://formcheck_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://formcheck_api;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://formcheck_api;
        proxy_set_header Host $host;
    }

    # --- Neural TTS ---
    # Prefer FastAPI /tts proxy (same upstream as API) so HTTPS/certbot server blocks work.
    # Direct Node upstream kept as fallback path /tts-direct → :3002
    location = /tts {
        proxy_pass http://formcheck_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        client_max_body_size 1m;
    }

    location = /tts/health {
        proxy_pass http://formcheck_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /tts-direct/ {
        proxy_pass http://formcheck_tts/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        client_max_body_size 1m;
    }

    # --- Static frontend (web/) ---
    # UPDATE this path to the clone location on the server (often /home/opc/kinetix/web)
    root /home/opc/kinetix/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache MediaPipe model a bit; keep HTML/JS fresh while iterating
    location /models/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }
}
