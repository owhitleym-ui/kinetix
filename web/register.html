<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account · Kinetix</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
</head>
<body>
  <main class="auth-page">
    <a class="auth-brand" href="index.html">
      <svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.65 9.9L14.35 9.9L21.03 10.06L15.8 14.24L17.58 20.69L12 17L6.42 20.69L8.2 14.24L2.97 10.06Z" fill="#4ca154" stroke="#4ca154" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="5.4" r="2.8" fill="#306339"/></svg>
      Kinetix
    </a>
    <form class="auth-card" id="registerForm">
      <h1>Create account</h1>
      <p class="auth-sub">Choose whether you are a patient or a physical therapist.</p>

      <div class="role-seg" role="group" aria-label="Account type">
        <button type="button" class="role-btn" data-role="patient" aria-pressed="true">Patient</button>
        <button type="button" class="role-btn" data-role="pt" aria-pressed="false">Physical therapist</button>
      </div>
      <input type="hidden" name="role" id="role" value="patient">

      <label class="field">
        <span>Display name</span>
        <input type="text" name="displayName" autocomplete="name" required maxlength="200">
      </label>
      <label class="field">
        <span>Email</span>
        <input type="email" name="email" autocomplete="username" required>
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" name="password" autocomplete="new-password" required minlength="6">
      </label>
      <p class="auth-error" id="error" hidden></p>
      <button type="submit" class="btn primary" id="submit">Create account</button>
      <p class="auth-foot">Already have an account? <a href="login.html">Log in</a></p>
    </form>
  </main>
<script src="config.js"></script>
<script type="module">
  import { register, isLoggedIn, getUser } from "./auth.js";
  const home = () => (getUser()?.role === "pt" ? "index.html#/provider" : "index.html#/patient");
  if (isLoggedIn()) location.replace(home());

  const form = document.getElementById("registerForm");
  const roleInput = document.getElementById("role");
  const error = document.getElementById("error");
  const submit = document.getElementById("submit");

  document.querySelectorAll(".role-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".role-btn").forEach((b) => b.setAttribute("aria-pressed", "false"));
      btn.setAttribute("aria-pressed", "true");
      roleInput.value = btn.dataset.role;
    });
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    error.hidden = true;
    submit.disabled = true;
    const fd = new FormData(form);
    try {
      await register({
        email: String(fd.get("email")),
        password: String(fd.get("password")),
        displayName: String(fd.get("displayName")),
        role: String(fd.get("role")),
      });
      location.href = home();
    } catch (err) {
      error.textContent = err.message || "Registration failed";
      error.hidden = false;
      submit.disabled = false;
    }
  });
</script>
</body>
</html>
