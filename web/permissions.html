<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session permissions · Form Check</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%232563eb%22/%3E%3Ccircle cx=%228%22 cy=%228%22 r=%223.5%22 fill=%22white%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
</head>
<body>
  <div class="perms-page">
    <header>
      <div>
        <h1>Session permissions</h1>
        <div class="tag">Share individual workout sessions with a physical therapist</div>
      </div>
      <div class="account-nav" id="accountNav"></div>
    </header>
    <div id="banner" class="banner" hidden></div>
    <div id="list" class="session-list"></div>
  </div>
<script src="config.js"></script>
<script type="module">
  import { api, getUser, isLoggedIn, renderAccountNav } from "./auth.js";

  const banner = document.getElementById("banner");
  const list = document.getElementById("list");

  function showBanner(msg, isError = false) {
    banner.hidden = false;
    banner.textContent = msg;
    banner.classList.toggle("error", isError);
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
    );
  }

  function formatWhen(iso) {
    if (!iso) return "—";
    try {
      return new Date(iso).toLocaleString();
    } catch {
      return iso;
    }
  }

  function exerciseTitle(ex) {
    const map = {
      squat: "Bodyweight Squat",
      arm_abduction: "Shoulder Abduction",
      shoulder_extension: "Shoulder Extension",
    };
    return map[ex] || ex || "Session";
  }

  if (!isLoggedIn()) {
    location.replace("login.html");
  } else {
    const user = getUser();
    renderAccountNav();
    if (user?.role !== "patient") {
      showBanner("Only patient accounts can grant session permissions.", true);
      list.innerHTML = `<div class="empty-state"><a href="index.html">Back to Form Check</a></div>`;
    } else {
      load();
    }
  }

  let pts = [];

  async function load() {
    try {
      const [sessRes, ptsRes] = await Promise.all([
        api("/api/sessions"),
        api("/api/pts"),
      ]);
      pts = ptsRes.pts || [];
      render(sessRes.sessions || []);
    } catch (e) {
      showBanner(e.message || "Failed to load sessions", true);
      list.innerHTML = `<div class="empty-state">Could not load sessions. Is the ATP API running?</div>`;
    }
  }

  function render(sessions) {
    if (!sessions.length) {
      list.innerHTML = `<div class="empty-state">No sessions yet. Complete a workout while logged in, then share it here.</div>`;
      return;
    }
    list.innerHTML = sessions.map((s) => {
      const shares = s.shares || [];
      const sharedIds = new Set(shares.map((x) => x.ptUserId));
      const options = pts
        .filter((p) => !sharedIds.has(p.userId))
        .map((p) => `<option value="${esc(p.userId)}">${esc(p.displayName)} (${esc(p.email)})</option>`)
        .join("");
      const chips = shares.length
        ? shares.map((sh) => `
            <span class="share-chip">
              ${esc(sh.ptName || sh.ptEmail)}
              <button type="button" class="btn danger" data-revoke="${esc(s.sessionId)}" data-pt="${esc(sh.ptUserId)}">Revoke</button>
            </span>`).join("")
        : `<span class="session-meta" style="margin:0">Not shared with anyone yet</span>`;
      return `
        <article class="session-card" data-session="${esc(s.sessionId)}">
          <h2>${esc(exerciseTitle(s.exercise))}</h2>
          <div class="session-meta">${esc(formatWhen(s.startedAt))} · ${s.repCount || 0} reps · ${s.endedAt ? "ended" : "in progress"}</div>
          <div class="share-chips">${chips}</div>
          <div class="share-row">
            <select aria-label="Choose PT" data-select="${esc(s.sessionId)}" ${options ? "" : "disabled"}>
              <option value="">${options ? "Choose a PT…" : "No other PTs available"}</option>
              ${options}
            </select>
            <button type="button" class="btn ghost" data-grant="${esc(s.sessionId)}" ${options ? "" : "disabled"}>Share session</button>
          </div>
        </article>`;
    }).join("");

    list.querySelectorAll("[data-grant]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const sessionId = btn.dataset.grant;
        const select = list.querySelector(`select[data-select="${CSS.escape(sessionId)}"]`);
        const ptUserId = select?.value;
        if (!ptUserId) return;
        btn.disabled = true;
        try {
          await api(`/api/sessions/${encodeURIComponent(sessionId)}/share`, {
            method: "POST",
            body: JSON.stringify({ ptUserId }),
          });
          showBanner("Session shared with PT.");
          await load();
        } catch (e) {
          showBanner(e.message || "Share failed", true);
          btn.disabled = false;
        }
      });
    });

    list.querySelectorAll("[data-revoke]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const sessionId = btn.dataset.revoke;
        const ptUserId = btn.dataset.pt;
        btn.disabled = true;
        try {
          await api(
            `/api/sessions/${encodeURIComponent(sessionId)}/share/${encodeURIComponent(ptUserId)}`,
            { method: "DELETE" },
          );
          showBanner("Share revoked.");
          await load();
        } catch (e) {
          showBanner(e.message || "Revoke failed", true);
          btn.disabled = false;
        }
      });
    });
  }
</script>
</body>
</html>
