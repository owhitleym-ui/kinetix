<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Kinetix</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
</head>
<body>
  <main class="auth-page">
    <a class="auth-brand" href="index.html">
      <svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.65 9.9L14.35 9.9L21.03 10.06L15.8 14.24L17.58 20.69L12 17L6.42 20.69L8.2 14.24L2.97 10.06Z" fill="#4ca154" stroke="#4ca154" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="5.4" r="2.8" fill="#306339"/></svg>
      Kinetix
    </a>
    <form class="auth-card" id="loginForm">
      <h1>Log in</h1>
      <p class="auth-sub">Patient or physical therapist accounts use the same login.</p>
      <label class="field">
        <span>Email</span>
        <input type="email" name="email" autocomplete="username" required>
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <p class="auth-error" id="error" hidden></p>
      <button type="submit" class="btn primary" id="submit">Log in</button>
      <p class="auth-foot">No account? <a href="register.html">Create one</a></p>
    </form>
  </main>
<script src="config.js"></script>
<script type="module">
  import { login, isLoggedIn, getUser } from "./auth.js";
  const home = () => (getUser()?.role === "pt" ? "index.html#/provider" : "index.html#/patient");
  if (isLoggedIn()) location.replace(home());

  const form = document.getElementById("loginForm");
  const error = document.getElementById("error");
  const submit = document.getElementById("submit");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    error.hidden = true;
    submit.disabled = true;
    const fd = new FormData(form);
    try {
      await login(String(fd.get("email")), String(fd.get("password")));
      location.href = home();
    } catch (err) {
      error.textContent = err.message || "Login failed";
      error.hidden = false;
      submit.disabled = false;
    }
  });
</script>
</body>
</html>
