<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Form Check</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%232563eb%22/%3E%3Ccircle cx=%228%22 cy=%228%22 r=%223.5%22 fill=%22white%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
</head>
<body>
  <main class="auth-page">
    <a class="auth-brand" href="index.html">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.5"/></svg></span>
      Form Check
    </a>
    <form class="auth-card" id="loginForm">
      <h1>Log in</h1>
      <p class="auth-sub">Patient or physical therapist accounts use the same login.</p>
      <label class="field">
        <span>Email</span>
        <input type="email" name="email" autocomplete="username" required>
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <p class="auth-error" id="error" hidden></p>
      <button type="submit" class="btn primary" id="submit">Log in</button>
      <p class="auth-foot">No account? <a href="register.html">Create one</a></p>
    </form>
  </main>
<script src="config.js"></script>
<script type="module">
  import { login, isLoggedIn } from "./auth.js";
  if (isLoggedIn()) location.replace("index.html");

  const form = document.getElementById("loginForm");
  const error = document.getElementById("error");
  const submit = document.getElementById("submit");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    error.hidden = true;
    submit.disabled = true;
    const fd = new FormData(form);
    try {
      await login(String(fd.get("email")), String(fd.get("password")));
      location.href = "index.html";
    } catch (err) {
      error.textContent = err.message || "Login failed";
      error.hidden = false;
      submit.disabled = false;
    }
  });
</script>
</body>
</html>
