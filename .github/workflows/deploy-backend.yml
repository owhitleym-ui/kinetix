# Redeploy the FastAPI backend on the OCI server whenever backend code changes on main.
# Needs repo secrets: OCI_HOST, OCI_USER, OCI_SSH_KEY (private key whose public half is in the
# server's ~/.ssh/authorized_keys). The server resets to origin/main, then deploy.sh: pip install, restart, health check.
name: Deploy backend to OCI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy.sh"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up SSH key
        env:
          OCI_SSH_KEY: ${{ secrets.OCI
          OCI_HOST: ${{ secrets.OCI_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY"
          chmod 600 ~/.ssh/oci_deploy
          ssh-keyscan -H "$OCI_HOST" >v/null

      - name: Run deploy.sh on the server
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          REMOTE: cd ~/kinetix && git fetch origin main && git reset --hard origin/main && bash deploy.sh
        run: |
          ssh -n -i ~/.ssh/oci_deploy -o ConnectTimeout=20 \
            "$OCI_USER@$OCI_HOST" "$REMOTE"
        run: |
          sleep 3
          curl -fsS https://207-211-163-177.sslip.io/health
