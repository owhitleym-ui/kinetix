# Redeploy on OCI VM: sync env secrets, pull main, restart API/TTS/nginx.
# Secrets: OCI_HOST, OCI_USER, OCI_SSH_KEY, BACKEND_ENV, VOICE_FEEDBACK_ENV
name: Deploy to OCI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "web/**"
      - "voice-feedback/**"
      - "deploy/**"
      - "deploy.sh"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up SSH key
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          OCI_HOST: ${{ secrets.OCI_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/oci_deploy
          chmod 600 ~/.ssh/oci_deploy
          ssh-keyscan -H "$OCI_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pull, sync envs, deploy
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          VOICE_FEEDBACK_ENV: ${{ secrets.VOICE_FEEDBACK_ENV }}
        run: |
          set -euo pipefail
          SSH=(ssh -i ~/.ssh/oci_deploy -o ConnectTimeout=20 "$OCI_USER@$OCI_HOST")

          "${SSH[@]}" 'cd ~/kinetix && git fetch origin main && git reset --hard origin/main'

          if [ -n "${BACKEND_ENV:-}" ]; then
            printf '%s\n' "$BACKEND_ENV" | "${SSH[@]}" 'cat > ~/kinetix/backend/.env && chmod 600 ~/kinetix/backend/.env'
            echo "Wrote backend/.env"
          else
            echo "BACKEND_ENV secret empty — leaving existing backend/.env"
          fi

          if [ -n "${VOICE_FEEDBACK_ENV:-}" ]; then
            printf '%s\n' "$VOICE_FEEDBACK_ENV" | "${SSH[@]}" 'mkdir -p ~/kinetix/voice-feedback && cat > ~/kinetix/voice-feedback/.env && chmod 600 ~/kinetix/voice-feedback/.env'
            echo "Wrote voice-feedback/.env"
          else
            echo "VOICE_FEEDBACK_ENV secret empty — leaving existing voice-feedback/.env"
          fi

          "${SSH[@]}" 'cd ~/kinetix && bash deploy.sh'

      - name: Check the public API
        run: |
          sleep 3
          curl -fsS https://207-211-163-177.sslip.io/health
